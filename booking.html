<div class="container mt-4 mb-5">
  <h2>Form Booking Baru</h2>
  <p>Silakan isi data di bawah ini.</p>

  <form>
    <h5>Data Pasien</h5>
    <hr>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="nama" class="form-label">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" class="form-control" placeholder="Contoh: Rina Kusuma">
      </div>

      <div class="col-md-6 mb-3">
        <label for="nik" class="form-label">NIK</label>
        <input type="text" id="nik" name="nik" class="form-control" placeholder="16 digit NIK">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="tanggallahir" class="form-label">Tanggal Lahir</label>
        <input type="date" id="tanggallahir" name="tanggallahir" class="form-control">
      </div>

      <div class="col-md-6 mb-3">
        <label for="jk" class="form-label">Jenis Kelamin</label>
        <select id="jk" name="jk" class="form-select">
          <option>-- Pilih --</option>
          <option>Laki-laki</option>
          <option>Perempuan</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="hp" class="form-label">No. HP</label>
        <input type="text" id="hp" name="hp" class="form-control" placeholder="08xxxxxxxxxx">
      </div>
    </div>

    <h5 class="mt-4">Data Kunjungan</h5>
    <hr>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="dokter" class="form-label">Pilih Dokter</label>
        <select id="dokter" name="dokter" class="form-select">
          <option>-- Pilih Dokter --</option>
          <option>dr. Amira Sari</option>
          <option>dr. Budi Santoso</option>
          <option>dr. Citra Wulandari</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="tanggal" class="form-label">Tanggal Kunjungan</label>
        <input type="date" id="tanggal" name="tanggal" class="form-control">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="jam" class="form-label">Jam Kunjungan</label>
        <select id="jam" name="jam" class="form-select">
          <option>-- Pilih Jam --</option>
          <option>09.00</option>
          <option>10.30</option>
          <option>13.00</option>
          <option>15.30</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="bayar" class="form-label">Metode Bayar</label>
        <select id="bayar" name="bayar" class="form-select">
          <option>-- Pilih --</option>
          <option>Bayar di Tempat</option>
          <option>BPJS</option>
          <option>Asuransi</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label for="keluhan" class="form-label">Keluhan</label>
      <textarea id="keluhan" name="keluhan" rows="4" class="form-control" placeholder="Tulis keluhan anda"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Kirim</button>
    <button type="reset" class="btn btn-secondary">Reset</button>
  </form>
</div>

</body>
