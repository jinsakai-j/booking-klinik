<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">Klinik Sejahtera</a>

        <li class="nav-item"><a class="nav-link" href="detail.html">Detail</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <h2>Edit Appointment</h2>
  <p>Mengubah data janji temu nomor 1.</p>

  <form>
    <h5>Data Pasien</h5>
    <hr>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="namalama" class="form-label">Nama Lengkap</label>
        <input type="text" id="namalama" name="namalama" class="form-control" value="Rina Kusuma">
      </div>

      <div class="col-md-6 mb-3">
        <label for="nik" class="form-label">NIK</label>
        <input type="text" id="nik" name="nik" class="form-control" value="3201234567890001">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="tanggallahir" class="form-label">Tanggal Lahir</label>
        <input type="date" id="tanggallahir" name="tanggallahir" class="form-control" value="1997-04-12">
      </div>

      <div class="col-md-6 mb-3">
        <label for="jk" class="form-label">Jenis Kelamin</label>
        <select id="jk" name="jk" class="form-select">
          <option>Laki-laki</option>
          <option selected>Perempuan</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="hp" class="form-label">No. HP</label>
        <input type="text" id="hp" name="hp" class="form-control" value="081234567890">
      </div>
    </div>

    <h5 class="mt-4">Data Kunjungan</h5>
    <hr>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="dokter" class="form-label">Pilih Dokter</label>
        <select id="dokter" name="dokter" class="form-select">
          <option selected>dr. Amira Sari</option>
          <option>dr. Budi Santoso</option>
          <option>dr. Citra Wulandari</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="tanggal" class="form-label">Tanggal Kunjungan</label>
        <input type="date" id="tanggal" name="tanggal" class="form-control" value="2026-09-28">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="jam" class="form-label">Jam Kunjungan</label>
        <select id="jam" name="jam" class="form-select">
          <option selected>09.00</option>
          <option>10.30</option>
          <option>13.00</option>
          <option>15.30</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="status" class="form-label">Status</label>
        <select id="status" name="status" class="form-select">
          <option>Menunggu</option>
          <option selected>Konfirmasi</option>
          <option>Selesai</option>
          <option>Dibatalkan</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label for="keluhan" class="form-label">Keluhan</label>
      <textarea id="keluhan" name="keluhan" rows="4" class="form-control">Demam dan pilek sejak 3 hari lalu.</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Simpan</button>
    <button type="reset" class="btn btn-secondary">Batal</button>
  </form>
</div>

<footer>
  <p class="footer-text">Rajaa Azharul Hanafi - 103022400116</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
